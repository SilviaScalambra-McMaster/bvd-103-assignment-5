events {}

http {
  resolver 127.0.0.11 ipv6=off valid=30s;

  server {
    listen 80;
    client_max_body_size 2m;

    location /books {
      set $catalogue_upstream http://catalogue:3000;
      proxy_pass $catalogue_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /warehouse {
      set $warehouse_upstream http://warehouse:3000;
      proxy_pass $warehouse_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orders {
      set $orders_upstream http://orders:3000;
      proxy_pass $orders_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
      set $swagger_upstream http://swagger:3000;
      proxy_pass $swagger_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
