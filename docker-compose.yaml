services:
  catalogue-mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - catalogue-data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  warehouse-mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - warehouse-data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  orders-mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - orders-data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalogue:
    build:
      context: .
      dockerfile: services/catalogue/Dockerfile
    environment:
      PORT: 3000
      MONGO_URI: mongodb://catalogue-mongo:27017
      RABBITMQ_URL: amqp://rabbitmq
    depends_on:
      catalogue-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  warehouse:
    build:
      context: .
      dockerfile: services/warehouse/Dockerfile
    environment:
      PORT: 3000
      MONGO_URI: mongodb://warehouse-mongo:27017
      RABBITMQ_URL: amqp://rabbitmq
      CATALOGUE_URL: http://catalogue:3000
    depends_on:
      warehouse-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalogue:
        condition: service_started

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      PORT: 3000
      MONGO_URI: mongodb://orders-mongo:27017
      RABBITMQ_URL: amqp://rabbitmq
      CATALOGUE_URL: http://catalogue:3000
    depends_on:
      orders-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalogue:
        condition: service_started

  swagger:
    build:
      context: .
      dockerfile: services/swagger/Dockerfile
    environment:
      PORT: 3000
    depends_on:
      - catalogue
      - warehouse
      - orders

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalogue
      - warehouse
      - orders
      - swagger

volumes:
  catalogue-data:
  warehouse-data:
  orders-data:
